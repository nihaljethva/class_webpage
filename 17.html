
<html>
<head>
	<title>filter property</title>
	<style type="text/css">
		.i{
			height: 500px;
			width: 300px;
		}
		.i1{
			filter: blur(10px);
		}
		.i2{
			filter: brightness(250%);
		}
		.i3{
			filter: grayscale(100%);
		}
		.i4{
			filter: contrast(200%);
		}
		.i5{
			filter: opacity(70%);
		}
		.h1{
			background-color: pink;
		}
	</style>
</head>
<body class="h1">
<img src="img.jpg" class="i i1">
<img src="img.jpg" class="i i2">
<img src="img.jpg" class="i i3">
<img src="img.jpg" class="i i4">
<img src="img.jpg" class="i i5">
</body>
</html>
